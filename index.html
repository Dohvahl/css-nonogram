<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Nonogram</title>
  <link rel="stylesheet" href="nonogram.css">
</head>
<body>
  <main class="puzzle">
    <h1>Nonogram</h1>

    <!-- Unchecked = fill mode, checked = mark mode. -->
    <input type="checkbox" id="mode-mark" class="mode">
    <label class="mode-switch" for="mode-mark">
      <span class="mode-fill">Fill</span>
      <span class="mode-mark">Mark</span>
    </label>

    <div class="board">
      <!-- clue-spacer sits above the row-clue gutter so the five column
           numbers line up over their cells. -->
      <div class="col-clues">
        <div class="clue-spacer"></div>
        <div class="col-clue cc1"><span>2</span></div>
        <div class="col-clue cc2"><span>4</span></div>
        <div class="col-clue cc3"><span>4</span></div>
        <div class="col-clue cc4"><span>4</span></div>
        <div class="col-clue cc5"><span>2</span></div>
      </div>

      <!-- Row 1 : . # . # .  ->  clue 1 1 -->
      <div class="row r1">
        <div class="row-clue"><span>1</span><span>1</span></div>
        <div class="cell c1 sol-empty">
          <input type="radio" name="r1c1" id="r1c1-e" class="s s-empty" checked>
          <input type="radio" name="r1c1" id="r1c1-f" class="s s-fill">
          <input type="radio" name="r1c1" id="r1c1-m" class="s s-mark">
          <label class="to-fill"  for="r1c1-f"></label>
          <label class="to-mark"  for="r1c1-m"></label>
          <label class="to-empty" for="r1c1-e"></label>
        </div>
        <div class="cell c2 sol-fill">

          <label class="to-fill"  for="r1c2-f"></label>

          <label class="to-fill"  for="r1c3-f"></label>

          <label class="to-empty" for="r1c4-e"></label>

      </div>

      <!-- Row 4 : . # # # .  ->  clue 3 -->
      <div class="row r4">
        <div class="row-clue"><span>3</span></div>
        <div class="cell c1 sol-empty">
          <input type="radio" name="r4c1" id="r4c1-e" class="s s-empty" checked>

</html>
